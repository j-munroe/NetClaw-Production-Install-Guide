# GitLab Community Edition: JWT id_tokens + Vault CLI (recommended for this project).
# secrets:vault is Premium/Ultimate only — see gitlab-ci-premium-secrets-vault.yml
# Docs: docs/GITLAB.md

stages:
  - validate

variables:
  VAULT_ADDR: "https://vault.example.local:8200"
  VAULT_AUTH_ROLE: "gitlab-network-lab"

lab_secret_smoke:
  stage: validate
  image: hashicorp/vault:latest   # pin e.g. :2.2.2 in production — docs/VERSIONS.md
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.example.local
  script:
    - |
      set -euo pipefail
      export VAULT_TOKEN="$(vault write -field=token auth/jwt/login \
        role="${VAULT_AUTH_ROLE}" jwt="${VAULT_ID_TOKEN}")"
      export NETBOX_TOKEN="$(vault kv get -field=api_token secret/platform/netbox)"
      echo "NETBOX_TOKEN length: ${#NETBOX_TOKEN}"
      vault kv get -field=password secret/network/lab/dc1/lab-rtr-01/credentials \
        > /tmp/device_password
      chmod 600 /tmp/device_password
      test -s /tmp/device_password
      echo "Device password file OK (contents not printed)"
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
