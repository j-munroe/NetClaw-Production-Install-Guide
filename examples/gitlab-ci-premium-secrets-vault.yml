# GitLab Premium / Ultimate ONLY — declarative secrets:vault keyword.
# Community Edition: use gitlab-ci-ce.yml instead (JWT + Vault CLI).
# Docs: docs/GITLAB.md

stages:
  - validate

variables:
  VAULT_SERVER_URL: "https://vault.example.local:8200"
  VAULT_AUTH_ROLE: "gitlab-network-stage"

stage_secret_smoke:
  stage: validate
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.example.local
  secrets:
    NETBOX_TOKEN:
      vault: platform/netbox/api_token@secret
      file: false
      token: $VAULT_ID_TOKEN
    DEVICE_PASSWORD:
      vault: network/stage/dc1/rtr-01/credentials/password@secret
      file: true
      token: $VAULT_ID_TOKEN
  script:
    - |
      set -euo pipefail
      echo "NETBOX_TOKEN length: ${#NETBOX_TOKEN}"
      if [[ ! -s "${DEVICE_PASSWORD}" ]]; then
        echo "DEVICE_PASSWORD file missing or empty" >&2
        exit 1
      fi
      echo "Device password file OK (contents not printed)"
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
